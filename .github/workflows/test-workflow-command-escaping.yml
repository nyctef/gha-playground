name: Test Edge Cases

on:
  push:
    branches:
      - main

jobs:
  do-some-build-stuff:
    runs-on: ubuntu-latest
    steps:
      - name: print some workflow commands
        run: |
          # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands
          # https://github.com/orgs/community/discussions/26736
          # https://github.com/actions/toolkit/blob/cee7d92d1d02e3107c9b1387b9690b89096b67be/packages/core/src/command.ts#L92-L105
          # looks like urlencoding is the way to go?
          echo "This is a normal line"
          echo "::warning::This is a warning message"
          echo "::warning::This is a warning message with a comma %2C colons %3A%3A and newline %0A in it"
          echo "::add-mask::my secret value"
          echo "secret value should be masked: my secret value"
